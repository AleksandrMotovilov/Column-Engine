name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: fetch dependencies
      run: sudo apt-get install libgtest-dev clang-format clang-tidy

    - name: cmake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: make
      run: |
        cd build
        make

    - name: test
      run: |
        cd build
        ./tests/test_schema
        ./tests/test_from_csv_to_clmn
        ./tests/test_from_clmn_to_csv
        ./tests/test_convertion


